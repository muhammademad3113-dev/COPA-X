name: Build COPA X Universal APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  FFMPEG_TAG: "build-264"
  QUICKJS_TAG: "v0.15.1"

jobs:
  build:
    name: Build Universal APK
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. تحميل المشروع
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. التأكد من الملفات
      # =====================================================

      - name: Check project
        shell: bash
        run: |
          set -e

          echo "Project:"
          pwd
          ls -la

          test -f main.py
          test -f pyproject.toml

          echo "Project files OK."

      # =====================================================
      # 3. Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # =====================================================
      # 4. أدوات النظام
      # =====================================================

      - name: Install system tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            unzip \
            zip \
            git \
            jq \
            cmake \
            ninja-build \
            build-essential

      # =====================================================
      # 5. Python packages
      # =====================================================

      - name: Install Python packages
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "flet[all]>=0.86.0,<1.0.0" \
            "yt-dlp[default]" \
            "yt-dlp-ejs"

          echo "Python:"
          python --version

          echo "Flet:"
          flet --version

          echo "yt-dlp:"
          python -c "import yt_dlp; print(yt_dlp.version.__version__)"

      # =====================================================
      # 6. إنشاء مجلدات binaries
      # =====================================================

      - name: Prepare assets
        shell: bash
        run: |
          set -e

          mkdir -p assets/bin/arm64-v8a
          mkdir -p assets/bin/armeabi-v7a
          mkdir -p assets/bin/x86_64

      # =====================================================
      # 7. FFmpeg
      #
      # مهم:
      # لا نعتمد على اسم ملف ثابت.
      # نطلب من GitHub API اسم الـasset الحقيقي.
      # =====================================================

      - name: Download FFmpeg Android
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/rhythmcache/ffmpeg-android/releases/tags/${FFMPEG_TAG}"

          echo "Reading FFmpeg release..."
          echo "$API"

          curl \
            --fail \
            --location \
            --retry 5 \
            "$API" \
            -o /tmp/ffmpeg-release.json

          echo
          echo "FFmpeg release:"
          jq -r '.name' /tmp/ffmpeg-release.json

          download_ffmpeg() {

            ABI="$1"

            echo
            echo "======================================"
            echo "FFmpeg ${ABI}"
            echo "======================================"

            ASSET_URL="$(
              jq -r \
              --arg ABI "$ABI" \
              '
              .assets[]
              | select(.name | contains("Static-android-" + $ABI))
              | .browser_download_url
              ' \
              /tmp/ffmpeg-release.json \
              | head -n 1
            )"

            if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
              echo "ERROR: Static FFmpeg asset not found for ${ABI}"

              echo
              echo "Available assets:"
              jq -r '.assets[].name' /tmp/ffmpeg-release.json

              exit 1
            fi

            echo "Asset:"
            echo "$ASSET_URL"

            ZIP="/tmp/ffmpeg-${ABI}.zip"
            DIR="/tmp/ffmpeg-${ABI}"

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 3 \
              "$ASSET_URL" \
              -o "$ZIP"

            rm -rf "$DIR"
            mkdir -p "$DIR"

            unzip \
              -o \
              "$ZIP" \
              -d "$DIR"

            echo
            echo "Archive contents:"
            find "$DIR" -type f -print

            BIN="$(
              find "$DIR" \
                -type f \
                -name "ffmpeg" \
                | head -n 1
            )"

            if [ -z "$BIN" ]; then
              echo "ERROR: ffmpeg executable not found."

              exit 1
            fi

            cp \
              "$BIN" \
              "assets/bin/${ABI}/ffmpeg"

            chmod +x \
              "assets/bin/${ABI}/ffmpeg"

            echo
            echo "Installed FFmpeg:"
            ls -lh \
              "assets/bin/${ABI}/ffmpeg"

            file \
              "assets/bin/${ABI}/ffmpeg"
          }

          download_ffmpeg arm64-v8a
          download_ffmpeg armeabi-v7a
          download_ffmpeg x86_64

      # =====================================================
      # 8. Android NDK
      # =====================================================

      - name: Detect Android NDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          NDK_DIR="$(
            find "$ANDROID_HOME/ndk" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$NDK_DIR" ]; then
            echo "ERROR: Android NDK not found."
            exit 1
          fi

          echo "Using NDK:"
          echo "$NDK_DIR"

          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"

      # =====================================================
      # 9. QuickJS-NG
      # =====================================================

      - name: Build QuickJS-NG
        shell: bash
        run: |
          set -e

          rm -rf /tmp/quickjs-ng

          git clone \
            --depth 1 \
            --branch "${QUICKJS_TAG}" \
            https://github.com/quickjs-ng/quickjs.git \
            /tmp/quickjs-ng

          build_qjs() {

            ABI="$1"
            BUILD="/tmp/qjs-${ABI}"

            echo
            echo "======================================"
            echo "QuickJS ${ABI}"
            echo "======================================"

            rm -rf "$BUILD"

            cmake \
              -S /tmp/quickjs-ng \
              -B "$BUILD" \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK}/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="${ABI}" \
              -DANDROID_PLATFORM=android-24 \
              -DBUILD_SHARED_LIBS=OFF \
              -DQJS_BUILD_LIBC=ON \
              -DQJS_BUILD_EXAMPLES=OFF \
              -DQJS_BUILD_TESTING=OFF \
              -DQJS_BUILD_WERROR=OFF

            cmake \
              --build "$BUILD" \
              --target qjs \
              --parallel 2

            QJS="$(
              find "$BUILD" \
                -type f \
                -name "qjs" \
                -perm -111 \
                | head -n 1
            )"

            if [ -z "$QJS" ]; then
              echo "ERROR: QuickJS executable not found."
              find "$BUILD" -type f -print
              exit 1
            fi

            cp \
              "$QJS" \
              "assets/bin/${ABI}/qjs"

            chmod +x \
              "assets/bin/${ABI}/qjs"

            echo "QuickJS installed:"
            ls -lh \
              "assets/bin/${ABI}/qjs"

            file \
              "assets/bin/${ABI}/qjs"
          }

          build_qjs arm64-v8a
          build_qjs armeabi-v7a
          build_qjs x86_64

      # =====================================================
      # 10. فحص كل الملفات
      # =====================================================

      - name: Verify binaries
        shell: bash
        run: |
          set -e

          for ABI in arm64-v8a armeabi-v7a x86_64
          do
            echo
            echo "===== ${ABI} ====="

            test -x \
              "assets/bin/${ABI}/ffmpeg"

            test -x \
              "assets/bin/${ABI}/qjs"

            ls -lh \
              "assets/bin/${ABI}/ffmpeg"

            ls -lh \
              "assets/bin/${ABI}/qjs"
          done

          echo
          echo "FFmpeg + QuickJS OK."

      # =====================================================
      # 11. فحص main.py
      # =====================================================

      - name: Validate Python
        shell: bash
        run: |
          set -e

          python -m py_compile main.py

          echo "main.py OK."

      # =====================================================
      # 12. تثبيت dependencies المشروع
      # =====================================================

      - name: Install project dependencies
        shell: bash
        run: |
          set -e

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      # =====================================================
      # 13. تنظيف
      # =====================================================

      - name: Clean build
        shell: bash
        run: |
          rm -rf build
          rm -rf release

          mkdir -p release

      # =====================================================
      # 14. Universal APK
      # =====================================================

      - name: Build Universal APK
        shell: bash
        run: |
          set -e

          flet build apk \
            --yes \
            --verbose

      # =====================================================
      # 15. العثور على APK
      # =====================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find build \
            -type f \
            -name "*.apk" \
            -print

          APK="$(
            find build \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            find build \
              -type f \
              -print

            exit 1
          fi

          cp \
            "$APK" \
            release/COPA-X-Universal.apk

      # =====================================================
      # 16. معلومات APK
      # =====================================================

      - name: APK information
        shell: bash
        run: |
          set -e

          ls -lh \
            release/COPA-X-Universal.apk

          sha256sum \
            release/COPA-X-Universal.apk

      # =====================================================
      # 17. رفع APK
      # =====================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COPA-X-Universal-APK
          path: release/COPA-X-Universal.apk
          if-no-files-found: error
          retention-days: 30
