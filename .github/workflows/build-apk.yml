name: Build Universal APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build:
    name: Build Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet[all]"

      - name: Check project
        run: |
          python --version
          flet --version
          echo "Project files:"
          ls -la

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Build Universal APK
        run: |
          flet build apk --yes --verbose

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find build -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p release
          APK=$(find build -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" release/COPA-X-Universal.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COPA-X-Universal-APK
          path: release/COPA-X-Universal.apk
          if-no-files-found: error
          retention-days: 30
