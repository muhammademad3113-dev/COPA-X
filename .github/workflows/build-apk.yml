name: Build Universal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Find APK
        run: |
          echo "APK files:"
          find build/app/outputs/flutter-apk -type f -name "*.apk" -print

      - name: Rename APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
             release/COPA-X-Universal.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COPA-X-Universal-APK
          path: release/COPA-X-Universal.apk
          retention-days: 30
